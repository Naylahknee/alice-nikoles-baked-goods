  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  src: url(\"ba807b3c-b5ce-4bcd-9fc7-645744cf2ffa\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Fredoka';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"0afb6ea6-fc9c-4246-a44e-0fd7fdd4b16e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Fredoka';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"b1189179-538c-4ce9-8dc7-d76df8b7aea3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"310cd068-f799-4110-826a-5447dec500d1\"><\u002Fscript>\n<style>body{margin:0}a{color:#1A1A1A}a:hover{color:#B33D7A}doc-page:not(:defined){visibility:hidden}<\u002Fstyle>\n<\u002Fhelmet>\n\n<doc-page size=\"letter\" margin=\"0.75in\">\n<div style=\"font-family:Figtree;color:#1A1A1A;font-size:11.5pt;line-height:1.6\">\n  <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:8px\">\n    <img src=\"4d65caf6-a35b-4e02-883d-6fdebcafc3bf\" alt=\"Alice &amp; Nikole's Baked Goods logo\" style=\"width:96px;height:96px\">\n    <div>\n      <h1 style=\"font-family:Fredoka;font-weight:600;font-size:28pt;line-height:1.05;margin:0\">Alice &amp; Nikole's Baked Goods: Tuition Business Plan<\u002Fh1>\n      <p style=\"margin:6px 0 0;font-size:11pt\">Raising $40,000 for Melrina Nikole's culinary school tuition · Sacramento, CA · October 24, 2026<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr style=\"border:0;border-top:2px solid #1A1A1A;margin:16px 0 20px\">\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:0 0 8px\">Summary<\u002Fh2>\n  <p>Alice is Melrina Nikole's grandmother. Melrina is going to culinary school to pursue her dream of baking and to carry on her grandmother's cooking and baking legacy. This plan raises $40,000 in tuition over 13 weeks, from October 26, 2026 to January 24, 2027, by relaunching the family's cookie business under a Sacramento County Class A Cottage Food registration and pairing cookie sales with sponsorships, family and community giving, and scholarships.<\u002Fp>\n\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:14px 0 22px;font-size:11pt\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#BDE5EF\"><sc-raw-th style=\"text-align:left;padding:8px 10px\">Source<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:8px 10px\">Target<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:8px 10px\">When<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:8px 10px\">Cookie sales, net profit<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;text-align:right\">$12,000<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px\">Weeks 6–13<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:8px 10px\">Local business sponsors<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;text-align:right\">$12,000<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px\">Weeks 1–12<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:8px 10px\">Family &amp; community giving<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;text-align:right\">$8,000<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px\">Weeks 1–13<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:8px 10px\">Scholarships<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;text-align:right\">$8,000<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px\">Apply weeks 1–3<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"font-weight:700\"><sc-raw-td style=\"padding:8px 10px\">Total<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;text-align:right\">$40,000<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px\">By Jan 24, 2027<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:0 0 8px\">Why four sources<\u002Fh2>\n  <p>Permits take about five weeks, so cookies can only be sold for about eight weeks. Raising the full $40,000 from cookies would mean roughly 33,700 cookies, or 4,210 a week and about 44 oven hours a week. The mixed plan needs 1,263 cookies a week, about 13 oven hours, which two bakers in a home kitchen can manage.<\u002Fp>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Products and pricing<\u002Fh2>\n  <p>All three cookies are shelf stable: no cream, custard, or meat fillings, and nothing that needs a fridge. Prices for the first two come from the February 2026 Instagram price list.<\u002Fp>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:10.5pt\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#F7C9E0\"><sc-raw-th style=\"text-align:left;padding:7px 9px\">Cookie<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:7px 9px\">3<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:7px 9px\">6<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:7px 9px\">Dozen<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:7px 9px\">Est. cost/cookie<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:7px 9px\">Profit/dozen<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px\">Great Grand Chocolate Chip (contains nuts)<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$8<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$14<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$25<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$0.85<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$14.80<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px\">Ginger No-Snap<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$7<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$12<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$20<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$0.60<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$12.80<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px\">Toasted Marshmallow (new, proposed)<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$8<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$14<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$24<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$0.75<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;text-align:right\">$15.00<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font-size:10pt\">Costs include ingredients and packaging and are planning estimates; confirm against current receipts. Bulk packs: Family 40 ($85 / $70), Party 60 ($120 / $95), Event 100 ($190 / $150) for chocolate chip / ginger. The marshmallow cookie must use an egg-free, store-bought marshmallow with no cream filling, and EMD should review it before labels are printed.<\u002Fp>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Items to sell<\u002Fh2>\n  <p>With an order mix of 45% chocolate chip, 30% ginger, and 25% marshmallow, average profit is about $14.25 a dozen. The $12,000 cookie target takes about <strong>842 dozen (10,105 cookies)<\u002Fstrong> over eight selling weeks, about <strong>105 dozen a week<\u002Fstrong>, for roughly $19,580 in gross sales. That is about 22% of the 2026 Class A sales cap of $88,878. Event packs of 100 are the fastest way to volume.<\u002Fp>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Pathway<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:10.5pt\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#BDE5EF\"><sc-raw-th style=\"text-align:left;padding:7px 9px;width:22%\">Weeks<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:7px 9px\">Business<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:7px 9px\">Fundraising<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px;vertical-align:top\"><strong>1<\u002Fstrong> · Oct 26<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Bake each cookie 3 times by weight. Confirm city limits. Apply online for City BOT and Home Occupation Permit.<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Open giving page. Share the story on Instagram. Build sponsor and scholarship lists.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px;vertical-align:top\"><strong>2<\u002Fstrong> · Nov 2<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Set up kitchen zones. Test packaging. Write ingredient lists, allergens, label template.<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Send sponsor pitches. Submit first scholarship applications.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px;vertical-align:top\"><strong>3–5<\u002Fstrong> · Nov 9<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Apply to Sacramento County EMD for Class A ($306) with product list, labels, and city permits.<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Sponsor follow-ups. Holiday interest list, no payment until approval.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px;vertical-align:top\"><strong>6–9<\u002Fstrong> · Nov 30<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Open sales: home pickup by appointment, local delivery, California-only shipping. Holiday boxes.<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">About 60% of the cookie goal. Weekly progress posts.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid #E6DCE1\"><sc-raw-td style=\"padding:7px 9px;vertical-align:top\"><strong>10–12<\u002Fstrong> · Dec 28<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Event and party packs for January gatherings.<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Thank sponsors. Follow up on scholarships. Second giving push.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:7px 9px;vertical-align:top\"><strong>13<\u002Fstrong> · Jan 18<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Last orders. Close the books.<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 9px;vertical-align:top\">Final countdown. Tally all sources and pay tuition by Jan 24.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Resources needed<\u002Fh2>\n  <div style=\"column-count:2;column-gap:28px\">\n    <p style=\"margin:0 0 4px\"><strong>Permits and paperwork<\u002Fstrong><\u002Fp>\n    <ul style=\"margin:0 0 12px;padding-left:18px\"><li>City of Sacramento BOT certificate and Home Occupation Permit (fee per city email)<\u002Fli><li>Sacramento County EMD Class A registration, $306<\u002Fli><li>Product list and label samples for EMD<\u002Fli><li>Fictitious business name, if the trade name is not the operator's legal name<\u002Fli><li>CDTFA seller's permit check (free)<\u002Fli><li>Food safety training, if EMD lists it<\u002Fli><\u002Ful>\n    <p style=\"margin:0 0 4px\"><strong>Kitchen<\u002Fstrong><\u002Fp>\n    <ul style=\"margin:0 0 12px;padding-left:18px\"><li>Oven thermometer and kitchen scale<\u002Fli><li>Half sheet pans, parchment, cooling racks, mixer, bowls<\u002Fli><li>Sealed, labeled ingredient containers<\u002Fli><\u002Ful>\n    <p style=\"margin:0 0 4px\"><strong>Packaging and labels<\u002Fstrong><\u002Fp>\n    <ul style=\"margin:0 0 12px;padding-left:18px\"><li>Bags and boxes for 3, 6, 12, and bulk packs<\u002Fli><li>Labels with product name, operation name, permit number and county, ingredients by weight, net weight in US and metric, allergens, and \"Made in a Home Kitchen\" in 12-point type<\u002Fli><li>Thank-you and sponsor insert cards<\u002Fli><\u002Ful>\n    <p style=\"margin:0 0 4px\"><strong>Fundraising<\u002Fstrong><\u002Fp>\n    <ul style=\"margin:0 0 12px;padding-left:18px\"><li>Online giving page with the tuition story<\u002Fli><li>List of 30 local businesses to ask<\u002Fli><li>Scholarship list with deadlines<\u002Fli><li>Sales log and donation log from day one<\u002Fli><\u002Ful>\n  <\u002Fdiv>\n  <p style=\"font-size:10pt\">Only the $306 county fee is known. City fees come in the BOT payment email. Get real quotes for packaging and labels.<\u002Fp>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Sponsor tiers<\u002Fh2>\n  <p><strong>Great Grand, $2,000 (3 spots):<\u002Fstrong> logo on the thank-you card in every box and a featured Instagram post. <strong>Ginger, $1,000 (4 spots):<\u002Fstrong> name on the thank-you card and a shout-out. <strong>Friend of the kitchen, $250 (8 spots):<\u002Fstrong> listed in the thank-you post. Gifts are not tax-deductible unless routed through a nonprofit.<\u002Fp>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Rules to follow<\u002Fh2>\n  <ul style=\"padding-left:18px;margin:0 0 12px\">\n    <li>No cookie sales, and no cookies as donation rewards, until the county registration is approved.<\u002Fli>\n    <li>Class A means direct sales only: no reselling through shops or cafes, and no shipping outside California.<\u002Fli>\n    <li>Farmers markets and pop-ups may need a separate Multi-Event Vendor or Temporary Food Facility Permit.<\u002Fli>\n    <li>Keep pickup traffic light under the Home Occupation rules.<\u002Fli>\n    <li>Use one trade name on all permits and labels. Instagram shows Alice and Nikole's Baked Goods; confirm the legal trade name before filing.<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Risks<\u002Fh2>\n  <ul style=\"padding-left:18px;margin:0 0 12px\">\n    <li>County review takes longer than 5 weeks: fewer selling weeks, so lean harder on sponsors and giving.<\u002Fli>\n    <li>Scholarship decisions arrive after January 24: treat any late awards as a cushion for the next term.<\u002Fli>\n    <li>Marshmallow recipe doesn't fit the approved list: launch with two cookies and shift volume to chocolate chip.<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"font-family:Fredoka;font-weight:600;font-size:17pt;margin:18px 0 8px\">Contacts<\u002Fh2>\n  <p style=\"margin:0\">City Revenue Services: (916) 808-8500 · Sacramento County EMD: (916) 875-8484, CottageFood@saccounty.gov<br>Orders and sponsorships: DM <a href=\"https://www.instagram.com/alicenikolebg/\">@alicenikolebg<\u002Fa> on Instagram<\u002Fp>\n<\u002Fdiv>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
